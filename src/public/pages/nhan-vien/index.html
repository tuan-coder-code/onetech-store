<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Nhân viên & Phân quyền - One Tech Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar Inject Container -->
  <div id="appSidebar"></div>

  <!-- Main Content Wrapper -->
  <div class="app-main">
    <!-- Navbar Inject Container -->
    <div id="appNavbar"></div>

    <!-- Page Body -->
    <main class="page-container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
          <h4 class="fw-bold mb-1">Quản lý Nhân viên & Phân quyền</h4>
          <p class="text-muted small mb-0">Quản trị tài khoản, vai trò (6 vai trò) và trạng thái hoạt động của nhân viên</p>
        </div>
        <div id="btnCreateContainer">
          <a href="/nhan-vien/form.html" class="btn btn-primary">
            <i class="bi bi-person-plus-fill me-1"></i> Thêm Nhân viên
          </a>
        </div>
      </div>

      <!-- Filters Bar -->
      <div class="card-custom p-3 mb-4">
        <form id="filterForm" class="row g-2 align-items-center">
          <div class="col-12 col-md-4">
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
              <input type="text" id="filterSearch" class="form-control" placeholder="Tìm theo tên, username hoặc SĐT...">
            </div>
          </div>
          <div class="col-12 col-sm-6 col-md-3">
            <select id="filterVaiTro" class="form-select">
              <option value="">-- Tất cả vai trò --</option>
              <option value="Quản lý">Quản lý</option>
              <option value="Thủ kho">Thủ kho</option>
              <option value="NV bán hàng">NV bán hàng</option>
              <option value="Thu ngân">Thu ngân</option>
              <option value="Kế toán">Kế toán</option>
              <option value="Kỹ thuật">Kỹ thuật</option>
            </select>
          </div>
          <div class="col-12 col-sm-6 col-md-3">
            <select id="filterTrangThai" class="form-select">
              <option value="">-- Tất cả trạng thái --</option>
              <option value="Hoạt động">Hoạt động</option>
              <option value="Khóa">Khóa tài khoản</option>
              <option value="Nghỉ việc">Nghỉ việc</option>
            </select>
          </div>
          <div class="col-12 col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel me-1"></i> Lọc</button>
            <button type="button" id="btnResetFilter" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
        </form>
      </div>

      <!-- Table of NhanVien -->
      <div class="card-custom">
        <div class="table-responsive">
          <table class="table table-custom table-hover">
            <thead>
              <tr>
                <th>Họ và tên</th>
                <th>Tên đăng nhập</th>
                <th>Vai trò (Phân quyền)</th>
                <th>Thông tin liên hệ</th>
                <th>Trạng thái</th>
                <th class="text-end">Hành động</th>
              </tr>
            </thead>
            <tbody id="tableNhanVienBody">
              <tr>
                <td colspan="6" class="text-center py-4">
                  <div class="spinner-border spinner-border-sm text-primary"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/nhanvien.js"></script>
</body>
</html>
