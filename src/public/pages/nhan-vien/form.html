<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin Nhân viên - One Tech Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar Inject Container -->
  <div id="appSidebar"></div>

  <!-- Main Content Wrapper -->
  <div class="app-main">
    <!-- Navbar Inject Container -->
    <div id="appNavbar"></div>

    <!-- Page Body -->
    <main class="page-container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0" id="formTitle">Thêm Nhân viên mới</h4>
            <a href="/nhan-vien/index.html" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
          </div>

          <div class="card-custom p-4">
            <form id="nhanVienForm">
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label">Họ và tên nhân viên <span class="text-danger">*</span></label>
                  <input type="text" id="inputHoTen" class="form-control" placeholder="VD: Trần Văn B" required>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                  <input type="text" id="inputSdt" class="form-control" placeholder="VD: 0912345678" required>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" id="inputEmail" class="form-control" placeholder="VD: tranvanb@gmail.com">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">Địa chỉ</label>
                  <input type="text" id="inputDiaChi" class="form-control" placeholder="VD: Hà Nội">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                  <input type="text" id="inputTenDangNhap" class="form-control font-monospace" placeholder="VD: tranvanb" required>
                  <div class="form-text d-none" id="helpTenDangNhap">Tên đăng nhập không thể thay đổi khi đã tạo.</div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">Vai trò / Phân quyền <span class="text-danger">*</span></label>
                  <select id="selectVaiTro" class="form-select" required>
                    <option value="Quản lý">Quản lý</option>
                    <option value="Thủ kho">Thủ kho</option>
                    <option value="NV bán hàng">NV bán hàng</option>
                    <option value="Thu ngân">Thu ngân</option>
                    <option value="Kế toán">Kế toán</option>
                    <option value="Kỹ thuật">Kỹ thuật</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" id="labelMatKhau">Mật khẩu <span class="text-danger">*</span></label>
                  <input type="password" id="inputMatKhau" class="form-control" placeholder="Mật khẩu đăng nhập">
                </div>

                <div class="col-12 col-md-6 d-none" id="containerTrangThai">
                  <label class="form-label">Trạng thái tài khoản</label>
                  <select id="selectTrangThai" class="form-select">
                    <option value="Hoạt động">Hoạt động</option>
                    <option value="Khóa">Khóa tài khoản</option>
                    <option value="Nghỉ việc">Nghỉ việc</option>
                  </select>
                </div>

                <div class="col-12 d-flex justify-content-end gap-2 pt-3 border-top">
                  <a href="/nhan-vien/index.html" class="btn btn-light">Hủy bỏ</a>
                  <button type="submit" id="btnSubmitForm" class="btn btn-primary">
                    <i class="bi bi-check2-circle me-1"></i> Lưu Nhân viên
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/nhanvien.js"></script>
</body>
</html>
