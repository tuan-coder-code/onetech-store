<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin Khách hàng - One Tech Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar Inject Container -->
  <div id="appSidebar"></div>

  <!-- Main Content Wrapper -->
  <div class="app-main">
    <!-- Navbar Inject Container -->
    <div id="appNavbar"></div>

    <!-- Page Body -->
    <main class="page-container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-6">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0" id="formTitle">Thêm Khách hàng mới</h4>
            <a href="/khach-hang/index.html" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
          </div>

          <div class="card-custom p-4">
            <form id="khachHangForm">
              <div class="mb-3">
                <label class="form-label">Họ và tên khách hàng <span class="text-danger">*</span></label>
                <input type="text" id="inputHoTen" class="form-control" placeholder="VD: Nguyễn Văn A" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                <input type="text" id="inputSdt" class="form-control" placeholder="VD: 0987654321" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="inputEmail" class="form-control" placeholder="VD: abc@gmail.com">
              </div>

              <div class="mb-4">
                <label class="form-label">Địa chỉ</label>
                <input type="text" id="inputDiaChi" class="form-control" placeholder="VD: 123 Cầu Giấy, Hà Nội">
              </div>

              <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                <a href="/khach-hang/index.html" class="btn btn-light">Hủy bỏ</a>
                <button type="submit" id="btnSubmitForm" class="btn btn-primary">
                  <i class="bi bi-check2-circle me-1"></i> Lưu Khách hàng
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/khachhang.js"></script>
</body>
</html>
