<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Khách hàng - One Tech Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar Inject Container -->
  <div id="appSidebar"></div>

  <!-- Main Content Wrapper -->
  <div class="app-main">
    <!-- Navbar Inject Container -->
    <div id="appNavbar"></div>

    <!-- Page Body -->
    <main class="page-container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
          <h4 class="fw-bold mb-1">Quản lý Khách hàng</h4>
          <p class="text-muted small mb-0">Danh sách khách hàng mua hàng, bảo hành và trả góp</p>
        </div>
        <div id="btnCreateContainer">
          <a href="/khach-hang/form.html" class="btn btn-primary">
            <i class="bi bi-person-plus me-1"></i> Thêm Khách hàng
          </a>
        </div>
      </div>

      <!-- Filters Bar -->
      <div class="card-custom p-3 mb-4">
        <form id="filterForm" class="row g-2 align-items-center">
          <div class="col-12 col-md-4">
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
              <input type="text" id="filterSearch" class="form-control" placeholder="Tìm theo tên hoặc SĐT...">
            </div>
          </div>
          <div class="col-12 col-md-3">
            <select id="filterHangThanhVien" class="form-select">
              <option value="">-- Tất cả hạng thẻ --</option>
              <option value="Đồng">Hạng Đồng</option>
              <option value="Bạc">Hạng Bạc</option>
              <option value="Vàng">Hạng Vàng</option>
              <option value="Kim Cương">Hạng Kim Cương</option>
            </select>
          </div>
          <div class="col-12 col-md-3">
            <select id="filterTongChiTieu" class="form-select">
              <option value="">-- Chi tiêu --</option>
              <option value="0-5000000">Dưới 5 triệu</option>
              <option value="5000000-20000000">5 triệu - 20 triệu</option>
              <option value="20000000-50000000">20 triệu - 50 triệu</option>
              <option value="50000000-">Trên 50 triệu</option>
            </select>
          </div>
          <div class="col-12 col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel me-1"></i> Tìm kiếm</button>
            <button type="button" id="btnResetFilter" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
        </form>
      </div>

      <!-- Table of KhachHang -->
      <div class="card-custom">
        <div class="table-responsive">
          <table class="table table-custom table-hover">
            <thead>
              <tr>
                <th>Họ và tên</th>
                <th>Thông tin liên hệ</th>
                <th>Hạng thẻ</th>
                <th>Tổng chi tiêu</th>
                <th class="text-end">Hành động</th>
              </tr>
            </thead>
            <tbody id="tableKhachHangBody">
              <tr>
                <td colspan="5" class="text-center py-4">
                  <div class="spinner-border spinner-border-sm text-primary"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/khachhang.js"></script>
</body>
</html>
