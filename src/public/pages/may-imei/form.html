<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin Máy IMEI - One Tech Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar Inject Container -->
  <div id="appSidebar"></div>

  <!-- Main Content Wrapper -->
  <div class="app-main">
    <!-- Navbar Inject Container -->
    <div id="appNavbar"></div>

    <!-- Page Body -->
    <main class="page-container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0" id="formTitle">Nhập máy IMEI mới vào kho</h4>
            <a href="/may-imei/index.html" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
          </div>

          <div class="card-custom p-4">
            <form id="mayImeiForm">
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label">Model Sản phẩm <span class="text-danger">*</span></label>
                  <select id="selectSanPham" class="form-select" required>
                    <option value="">-- Chọn model sản phẩm --</option>
                  </select>
                </div>

                <!-- Chế độ Sửa (chỉ hiện 1 IMEI readonly) -->
                <div class="col-12 d-none" id="editImeiContainer">
                  <label class="form-label">Số IMEI / Serial</label>
                  <input type="text" id="inputImeiReadonly" class="form-control font-monospace fw-bold bg-light" readonly>
                </div>

                <!-- Chế độ Thêm mới (hỗ trợ nhập 1 máy hoặc dán danh sách hàng loạt) -->
                <div class="col-12" id="createImeiContainer">
                  <ul class="nav nav-tabs mb-3" id="imeiTab" role="tablist">
                    <li class="nav-item" role="presentation">
                      <button class="nav-link active" id="single-tab" data-bs-toggle="tab" data-bs-target="#single-pane" type="button" role="tab">Nhập 1 máy</button>
                    </li>
                    <li class="nav-item" role="presentation">
                      <button class="nav-link" id="bulk-tab" data-bs-toggle="tab" data-bs-target="#bulk-pane" type="button" role="tab">Nhập hàng loạt (Paste danh sách)</button>
                    </li>
                  </ul>

                  <div class="tab-content" id="imeiTabContent">
                    <div class="tab-pane fade show active" id="single-pane" role="tabpanel">
                      <label class="form-label">Số IMEI / Serial (15 số) <span class="text-danger">*</span></label>
                      <input type="text" id="inputSingleImei" class="form-control font-monospace" placeholder="VD: 356789012345678">
                    </div>
                    <div class="tab-pane fade" id="bulk-pane" role="tabpanel">
                      <label class="form-label">Danh sách IMEI (Mỗi dòng 1 số IMEI)</label>
                      <textarea id="inputImeiList" class="form-control font-monospace" rows="4" placeholder="356789012345678&#10;356789012345679&#10;356789012345680"></textarea>
                      <div class="form-text">Có thể phân cách bằng dấu xuống dòng, dấu phẩy hoặc chấm phẩy.</div>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">Giá nhập gốc (VNĐ) <span class="text-danger">*</span></label>
                  <input type="text" id="inputGiaNhap" class="format-currency form-control" placeholder="VD: 25000000" required min="0">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">Trạng thái máy <span class="text-danger">*</span></label>
                  <select id="selectTrangThai" class="form-select" required>
                    <option value="Con hang">Còn hàng (Trong kho)</option>
                    <option value="Da ban">Đã bán</option>
                    <option value="Bao hanh">Bảo hành</option>
                    <option value="Loi">Lỗi / Đổi trả</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">Màu sắc</label>
                  <input type="text" id="inputMauSac" class="form-control" placeholder="Titan Tự Nhiên, Đen, Xanh...">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">Dung lượng bộ nhớ</label>
                  <input type="text" id="inputDungLuong" class="form-control" placeholder="128GB, 256GB, 512GB...">
                </div>

                <div class="col-12 d-flex justify-content-end gap-2 pt-3 border-top">
                  <a href="/may-imei/index.html" class="btn btn-light">Hủy bỏ</a>
                  <button type="submit" id="btnSubmitForm" class="btn btn-primary">
                    <i class="bi bi-check2-circle me-1"></i> Xác nhận Nhập kho
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/mayimei.js"></script>
</body>
</html>
